<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>condenser</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Reconstruir el retorno completo del agua</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 1 de 4 · Condensar y recoger</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><polyline points="295,220 560,220" fill="none" stroke="#287eb1" stroke-width="5" stroke-linejoin="round"/><polygon points="560,220 547.3937405670625,226.08951747755722 547.3937405670625,213.91048252244278" fill="#287eb1"/><polyline points="680,270 680,370" fill="none" stroke="#287eb1" stroke-width="5" stroke-linejoin="round"/><polygon points="680,370 673.9104825224427,357.39374056706254 686.0895174775573,357.39374056706254" fill="#287eb1"/><polyline points="560,420 295,420" fill="none" stroke="#287eb1" stroke-width="5" stroke-linejoin="round"/><polygon points="295,420 307.60625943293746,413.91048252244275 307.60625943293746,426.08951747755725" fill="#287eb1"/><polyline points="180,370 180,270" fill="none" stroke="#ab7625" stroke-width="8" stroke-linejoin="round"/><polygon points="180,270 186.08951747755722,282.60625943293746 173.91048252244278,282.60625943293746" fill="#ab7625"/><rect x="65" y="170" width="290" height="100" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="77" y="215.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Condensador / hotwell</text><text x="77" y="237.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">reúne líquido</text><rect x="560" y="170" width="290" height="100" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="572" y="215.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Bomba de condensado</text><text x="572" y="237.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">calentadores / desaireador</text><rect x="560" y="370" width="290" height="100" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="572" y="415.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Bomba alimentación</text><text x="572" y="437.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">válvulas / economizador</text><rect x="65" y="370" width="290" height="100" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="415.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Caldera</text><text x="77" y="437.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">producción de vapor</text><text x="70" y="526" font-family="Arial,sans-serif" font-size="16" fill="#193f3e">Retorno desde caldera a condensador a través de turbina y escape (simplificado).</text></svg>