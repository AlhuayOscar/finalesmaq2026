<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>nozzle</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Preparar combustible antes de pulverizar</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 4 de 4 · Formar el rocío</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><polyline points="295,220 560,220" fill="none" stroke="#287eb1" stroke-width="5" stroke-linejoin="round"/><polygon points="560,220 547.3937405670625,226.08951747755722 547.3937405670625,213.91048252244278" fill="#287eb1"/><polyline points="680,270 680,370" fill="none" stroke="#287eb1" stroke-width="5" stroke-linejoin="round"/><polygon points="680,370 673.9104825224427,357.39374056706254 686.0895174775573,357.39374056706254" fill="#287eb1"/><polyline points="560,420 295,420" fill="none" stroke="#ab7625" stroke-width="8" stroke-linejoin="round"/><polygon points="295,420 307.60625943293746,413.91048252244275 307.60625943293746,426.08951747755725" fill="#ab7625"/><rect x="65" y="170" width="250" height="100" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="215.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Almacenamiento</text><text x="77" y="237.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">tratamiento / servicio</text><rect x="560" y="170" width="250" height="100" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="572" y="215.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Bomba / calentador</text><text x="572" y="237.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">caudal / viscosidad</text><rect x="560" y="370" width="250" height="100" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="572" y="415.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Filtro</text><text x="572" y="437.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">retiene sólidos</text><rect x="65" y="370" width="250" height="100" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="77" y="415.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Pulverizador</text><text x="77" y="437.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">formación de gotas</text><text x="70" y="527" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">El combustible se quema: este recorrido no vuelve como combustible al tanque.</text><text x="580" y="507" font-family="Arial,sans-serif" font-size="17" fill="#cb6c32">Rocío + aire → combustión</text></svg>