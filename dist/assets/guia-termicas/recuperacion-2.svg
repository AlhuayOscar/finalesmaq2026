<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>exchanger</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Distinguir recuperación, economizador y caldera mixta</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 2 de 4 · Preguntar si hay evaporación</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><rect x="65" y="150" width="390" height="135" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="212.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Motor</text><text x="77" y="234.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">gases de escape</text><text x="80" y="142" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">01</text><rect x="540" y="150" width="390" height="135" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="552" y="212.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Recuperador</text><text x="552" y="234.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">agua o vapor</text><text x="555" y="142" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">02</text><rect x="65" y="365" width="390" height="135" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="427.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Quemador</text><text x="77" y="449.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">aporte propio</text><text x="80" y="357" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">03</text><rect x="540" y="365" width="390" height="135" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="552" y="427.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Servicio</text><text x="552" y="449.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">demanda de vapor</text><text x="555" y="357" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">04</text><text x="65" y="551" font-family="Arial,sans-serif" font-size="16" fill="#193f3e">Relaciones funcionales; no es un plano de tuberías ni una secuencia de válvulas.</text></svg>