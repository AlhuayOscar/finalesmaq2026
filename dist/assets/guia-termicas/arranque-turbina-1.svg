<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>one</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Preparar la turbina antes de tomar carga</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 1 de 4 · Verificar y lubricar</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><rect x="65" y="150" width="390" height="135" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="77" y="223.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Verificar y lubricar</text><text x="80" y="142" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">01</text><rect x="540" y="150" width="390" height="135" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="552" y="223.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Acondicionar con virador</text><text x="555" y="142" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">02</text><rect x="65" y="365" width="390" height="135" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="427.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Preparar vapor, drenajes</text><text x="77" y="449.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">y vacío</text><text x="80" y="357" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">03</text><rect x="540" y="365" width="390" height="135" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="552" y="438.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Vigilar el giro inicial</text><text x="555" y="357" font-family="Arial,sans-serif" font-size="20" fill="#ab7625">04</text><polyline points="455,220 540,220" fill="none" stroke="#193f3e" stroke-width="3" stroke-linejoin="round"/><polygon points="540,220 527.3937405670625,226.08951747755722 527.3937405670625,213.91048252244278" fill="#193f3e"/><polyline points="735,285 735,325 260,325 260,365" fill="none" stroke="#193f3e" stroke-width="3" stroke-linejoin="round"/><polygon points="260,365 253.91048252244278,352.39374056706254 266.08951747755725,352.39374056706254" fill="#193f3e"/><polyline points="455,435 540,435" fill="none" stroke="#193f3e" stroke-width="3" stroke-linejoin="round"/><polygon points="540,435 527.3937405670625,441.08951747755725 527.3937405670625,428.91048252244275" fill="#193f3e"/><text x="65" y="551" font-family="Arial,sans-serif" font-size="16" fill="#193f3e">Relaciones funcionales; no es un plano de tuberías ni una secuencia de válvulas.</text></svg>