<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Ordenar las superficies que recuperan calor</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 1 de 4 · Sobrecalentar vapor separado</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: SOBRECALENTAR VAPOR SEPARADO</text>
  </g>

  <!-- Content area -->
  
    <!-- Boiler Gas Duct Cross Section -->
    <path d="M 80 440 L 80 120 L 520 120 L 520 440 Z" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    
    <!-- Gas flow vertical path arrow -->
    <path d="M 120 420 L 120 140" stroke="#f97316" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowOrange)"/>
    <text x="110" y="280" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#f97316" transform="rotate(-90 110 280)">TIRO DE GASES CONVECTIVOS</text>

    <!-- 1. Superheater (Sobrecalentador Primario + Secundario) -->
    <g id="surf-superheater" filter="url(#activeGlow)">
      <rect x="150" y="330" width="340" height="85" rx="8" fill="#fee2e2" stroke="#d97706" stroke-width="4"/>
      
        <line x1="170" y1="340" x2="170" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="195" y1="340" x2="195" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="220" y1="340" x2="220" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="245" y1="340" x2="245" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="270" y1="340" x2="270" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="295" y1="340" x2="295" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="320" y1="340" x2="320" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="345" y1="340" x2="345" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="370" y1="340" x2="370" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="395" y1="340" x2="395" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="420" y1="340" x2="420" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="445" y1="340" x2="445" y2="405" stroke="#e11d48" stroke-width="3"/>
      
        <line x1="470" y1="340" x2="470" y2="405" stroke="#e11d48" stroke-width="3"/>
      
      <text x="320" y="320" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#e11d48">SOBRECALENTADOR (ZONA DE ALTA TEMPERATURA ~800°C GASES)</text>
      <text x="320" y="375" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b">Vapor saturado -> Vapor sobrecalentado (450°C - 510°C)</text>
    </g>

    <!-- 3. Economizer (Economizador de agua de alimentación) -->
    <g id="surf-economizer" >
      <rect x="150" y="225" width="340" height="75" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      
        <line x1="170" y1="235" x2="170" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="166" y1="262" x2="174" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="195" y1="235" x2="195" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="191" y1="262" x2="199" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="220" y1="235" x2="220" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="216" y1="262" x2="224" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="245" y1="235" x2="245" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="241" y1="262" x2="249" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="270" y1="235" x2="270" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="266" y1="262" x2="274" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="295" y1="235" x2="295" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="291" y1="262" x2="299" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="320" y1="235" x2="320" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="316" y1="262" x2="324" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="345" y1="235" x2="345" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="341" y1="262" x2="349" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="370" y1="235" x2="370" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="366" y1="262" x2="374" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="395" y1="235" x2="395" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="391" y1="262" x2="399" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="420" y1="235" x2="420" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="416" y1="262" x2="424" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="445" y1="235" x2="445" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="441" y1="262" x2="449" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
        <line x1="470" y1="235" x2="470" y2="290" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="466" y1="262" x2="474" y2="262" stroke="#0ea5e9" stroke-width="2"/>
      
      <text x="320" y="215" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369a1">ECONOMIZADOR (ZONA MEDIA ~400°C GASES)</text>
      <text x="320" y="265" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#075985">Agua alimentación: 130°C entra -> 210°C sale hacia el domo</text>
    </g>

    <!-- 4. Air Preheater (Precalentador de aire de combustión) -->
    <g id="surf-airheater" >
      <rect x="150" y="130" width="340" height="65" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/>
      
        <line x1="170" y1="138" x2="170" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="200" y1="138" x2="200" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="230" y1="138" x2="230" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="260" y1="138" x2="260" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="290" y1="138" x2="290" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="320" y1="138" x2="320" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="350" y1="138" x2="350" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="380" y1="138" x2="380" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="410" y1="138" x2="410" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="440" y1="138" x2="440" y2="188" stroke="#10b981" stroke-width="2"/>
      
        <line x1="470" y1="138" x2="470" y2="188" stroke="#10b981" stroke-width="2"/>
      
      <text x="320" y="120" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">PRECALENTADOR DE AIRE (ZONA BAJA ~240°C -> 140°C A CHIMENEA)</text>
      <text x="320" y="165" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">Aire forzado comburente entra a 30°C -> calienta a 160°C (+rendimiento)</text>
    </g>

    <!-- Sootblowers icons on gas duct -->
    <g transform="translate(495, 230)">
      <circle cx="12" cy="12" r="8" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
      <path d="M 4 12 L -20 12" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2"/>
      <text x="30" y="16" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#92400e">SOPLADOR DE HOLLÍN</text>
    </g>
    <g transform="translate(495, 340)">
      <circle cx="12" cy="12" r="8" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
      <path d="M 4 12 L -20 12" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2"/>
      <text x="30" y="16" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#92400e">SOPLADOR DE HOLLÍN</text>
    </g>

    <!-- 2. Attemperator / Desuperheater Diagram (Right Side) -->
    <g id="surf-reheater"  transform="translate(580, 140)">
      <rect width="360" height="280" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" filter="url(#cardShadow)"/>
      <text x="180" y="30" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#c2410c">DESOBRECALENTADOR / ATEMPERADOR</text>
      
      <!-- Attemperator Body -->
      <rect x="40" y="60" width="280" height="40" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <path d="M 20 80 L 340 80" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
      <text x="50" y="75" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#9a3412">Vapor SH 500°C</text>
      <text x="310" y="75" text-anchor="end" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#9a3412">Vapor regulado</text>

      <!-- Spray water injection -->
      <path d="M 180 20 L 180 60" stroke="#0284c7" stroke-width="4" marker-end="url(#arrowBlue)"/>
      <text x="180" y="15" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Inyección agua pura desmineralizada</text>
      <circle cx="180" cy="70" r="10" fill="#38bdf8" opacity="0.6"/>

      <!-- Explanation -->
      <g transform="translate(20, 130)">
        <text x="0" y="0" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">FUNCIÓN TÉCNICA:</text>
        <text x="0" y="20" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Control fino de temperatura de vapor sobrecalentado.</text>
        <text x="0" y="38" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Evita sobrecalentamiento excesivo de los álabes de turbina HP.</text>
        <text x="0" y="56" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Provee vapor a menor temperatura para servicios auxiliares.</text>
      </g>
    </g>

    <!-- Bottom Step Comparison Card -->
    <g transform="translate(60, 460)">
      <rect width="880" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="24" y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">ORDEN TÉRMICO DE RECUPERACIÓN EN EL TIRO DE GASES</text>
      <text x="24" y="44" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">1. Sobrecalentador: Máxima entalpía disponible tras los tubos de pantalla (800°C -> 450°C).</text>
      <text x="24" y="60" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">2. Economizador: Recupera calor residual precalentando el agua antes de que entre al domo de vapor (400°C -> 240°C).</text>
      <text x="24" y="76" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">3. Precalentador de aire: Extrae los últimos kJ útiles antes de la chimenea (240°C -> 140°C), superando el 88-90% de eficiencia.</text>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#e11d48"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Sobrecalentador (450-510°C)</text>
    <circle cx="230" cy="17" r="5" fill="#ea580c"/><text x="242" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Desobrecalentador / Atemperador</text>
    <circle cx="480" cy="17" r="5" fill="#0284c7"/><text x="492" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Economizador (200°C)</text>
    <circle cx="680" cy="17" r="5" fill="#10b981"/><text x="692" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Precalentador de aire (150°C)</text>
    <circle cx="890" cy="17" r="5" fill="#d97706"/><text x="902" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>