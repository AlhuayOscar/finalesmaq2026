<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Seguir aceite hasta cada cojinete y de regreso</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Acondicionar antes de distribuir</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: ACONDICIONAR ANTES DE DISTRIBUIR</text>
  </g>

  <!-- Content area -->
  
    <!-- Connecting pipes -->
    <g stroke-linecap="round">
      
        <line x1="420" y1="180" x2="560" y2="180" stroke="#d97706" stroke-width="4.5" marker-end="url(#arrowOrange)"/>
        <rect x="415" y="168" width="150" height="22" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="490" y="183" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Aceite presurizado hacia acondicionamiento</text>
      
        <line x1="720" y1="250" x2="720" y2="350" stroke="#0284c7" stroke-width="4.5" marker-end="url(#arrowBlue)"/>
        <rect x="645" y="288" width="150" height="22" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="720" y="303" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Aceite limpio y refrigerado</text>
      
        <line x1="560" y1="420" x2="420" y2="420" stroke="#b45309" stroke-width="4.5" marker-end="url(#arrowOrange)"/>
        <rect x="415" y="408" width="150" height="22" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="490" y="423" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Retorno por gravedad desde cojinetes</text>
      
        <line x1="260" y1="350" x2="260" y2="250" stroke="#d97706" stroke-width="4.5" marker-end="url(#arrowOrange)"/>
        <rect x="185" y="288" width="150" height="22" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="260" y="303" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Ingreso al sumidero / desaireación</text>
      
    </g>

    <!-- Stations Cards -->
    
      <g id="station-tank" >
        <rect x="100" y="110" width="320" height="140" rx="14" fill="url(#steelGrad)" stroke="#d97706" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="100" y="110" width="320" height="36" rx="14" fill="#d97706"/>
        <rect x="100" y="130" width="320" height="16" fill="#d97706"/>
        <text x="260" y="133" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">TANQUE SUMIDERO / CÁRTER</text>
        
          <text x="120" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Reserva de aceite en doble fondo</text>
        
          <text x="120" y="190" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Bombas de servicio (presión y caudal)</text>
        
          <text x="120" y="210" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Monitoreo de nivel y sedimentación</text>
        
      </g>
      
      <g id="station-condition" filter="url(#activeGlow)">
        <rect x="560" y="110" width="320" height="140" rx="14" fill="url(#activeGrad)" stroke="#d97706" stroke-width="3.5" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="560" y="110" width="320" height="36" rx="14" fill="#0284c7"/>
        <rect x="560" y="130" width="320" height="16" fill="#0284c7"/>
        <text x="720" y="133" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">FILTROS DÚPLEX Y ENFRIADOR</text>
        
          <text x="580" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Filtrado fino de partículas sólidas</text>
        
          <text x="580" y="190" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Control de viscosidad y temperatura</text>
        
          <text x="580" y="210" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Separación de impurezas</text>
        
      </g>
      
      <g id="station-bearings" >
        <rect x="560" y="350" width="320" height="140" rx="14" fill="url(#steelGrad)" stroke="#059669" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="560" y="350" width="320" height="36" rx="14" fill="#059669"/>
        <rect x="560" y="370" width="320" height="16" fill="#059669"/>
        <text x="720" y="373" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">COJINETES RADIALES Y EMPUJE</text>
        
          <text x="580" y="410" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Lubricación hidrodinámica (cuña de aceite)</text>
        
          <text x="580" y="430" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Refrigeración de metales de fricción</text>
        
          <text x="580" y="450" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Evita contacto metal-metal</text>
        
      </g>
      
      <g id="station-return" >
        <rect x="100" y="350" width="320" height="140" rx="14" fill="url(#steelGrad)" stroke="#b45309" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="100" y="350" width="320" height="36" rx="14" fill="#b45309"/>
        <rect x="100" y="370" width="320" height="16" fill="#b45309"/>
        <text x="260" y="373" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">LÍNEAS DE RETORNO POR GRAVEDAD</text>
        
          <text x="120" y="410" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Drenaje libre hacia el sumidero</text>
        
          <text x="120" y="430" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Visores de flujo y termómetros</text>
        
          <text x="120" y="450" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Retorno de cárter sin contrapresión</text>
        
      </g>
      
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
      <circle cx="20" cy="17" r="5" fill="#d97706"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Aceite a presión / Succión</text>
      <circle cx="210" cy="17" r="5" fill="#0284c7"/><text x="222" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Filtrado y enfriado</text>
      <circle cx="390" cy="17" r="5" fill="#059669"/><text x="402" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Puntos lubricados</text>
      <circle cx="560" cy="17" r="5" fill="#d97706"/><text x="572" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Componente activo</text>
    
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>