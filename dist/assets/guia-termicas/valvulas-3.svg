<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Identificar una válvula por lo que hace</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 3 de 4 · Separar regulación y protección</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: SEPARAR REGULACIÓN Y PROTECCIÓN</text>
  </g>

  <!-- Content area -->
  
    
      <g id="valve-globe" >
        <rect x="60" y="110" width="410" height="200" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="60" y="110" width="410" height="36" rx="14" fill="#0284c7"/>
        <rect x="60" y="130" width="410" height="16" fill="#0284c7"/>
        <text x="80" y="133" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">VÁLVULA GLOBO (REGULACIÓN / AISLACIÓN)</text>
        
          <text x="80" y="175" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Obturador móvil contra asiento circular</text>
        
          <text x="80" y="199" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Paso del fluido en forma de S</text>
        
          <text x="80" y="223" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Apta para estrangulación y regulación fina de caudal</text>
        
          <text x="80" y="247" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Cierre positivo bajo presión</text>
        
      </g>
      
      <g id="valve-check" >
        <rect x="530" y="110" width="410" height="200" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="530" y="110" width="410" height="36" rx="14" fill="#059669"/>
        <rect x="530" y="130" width="410" height="16" fill="#059669"/>
        <text x="550" y="133" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">VÁLVULA DE RETENCIÓN / SDNR</text>
        
          <text x="550" y="175" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Permite flujo en un solo sentido</text>
        
          <text x="550" y="199" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Cierre automático inmediato por flujo inverso</text>
        
          <text x="550" y="223" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• SDNR (Screw-Down Non-Return): permite además</text>
        
          <text x="550" y="247" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• bloquear el vástago manualmente para corte seguro</text>
        
      </g>
      
      <g id="valve-safety" filter="url(#activeGlow)">
        <rect x="60" y="340" width="410" height="200" rx="14" fill="url(#activeGrad)" stroke="#d97706" stroke-width="3.5" filter="url(#cardShadow)"/>
        <rect x="60" y="340" width="410" height="36" rx="14" fill="#e11d48"/>
        <rect x="60" y="360" width="410" height="16" fill="#e11d48"/>
        <text x="80" y="363" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">VÁLVULA DE SEGURIDAD (SOBREPRESIÓN)</text>
        
          <text x="80" y="405" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Protección de máxima emergencia por resorte calibrado</text>
        
          <text x="80" y="429" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Apertura pop rápida ante sobrepresión</text>
        
          <text x="80" y="453" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Blowdown: presión de cierre inferior a la de apertura</text>
        
          <text x="80" y="477" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Descarga directa a escape atmosférico</text>
        
      </g>
      
      <g id="valve-trap" >
        <rect x="530" y="340" width="410" height="200" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="530" y="340" width="410" height="36" rx="14" fill="#475569"/>
        <rect x="530" y="360" width="410" height="16" fill="#475569"/>
        <text x="550" y="363" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TRAMPA DE VAPOR (PURGA CONDENSADO)</text>
        
          <text x="550" y="405" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Evacua condensado continuo y gases incondensables</text>
        
          <text x="550" y="429" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Bloquea el paso de vapor vivo sin pérdidas</text>
        
          <text x="550" y="453" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Tipos: flotador mecánico, termodinámica o bimetálica</text>
        
          <text x="550" y="477" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Vital para evitar golpes de ariete en líneas</text>
        
      </g>
      
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Globo / Regulación</text>
    <circle cx="210" cy="17" r="5" fill="#059669"/><text x="222" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Retención / SDNR</text>
    <circle cx="390" cy="17" r="5" fill="#e11d48"/><text x="402" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Seguridad</text>
    <circle cx="510" cy="17" r="5" fill="#64748b"/><text x="522" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Trampa vapor</text>
    <circle cx="680" cy="17" r="5" fill="#d97706"/><text x="692" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Activo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>