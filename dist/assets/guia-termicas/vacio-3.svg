<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Relacionar condensador, vacío y sellado</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 3 de 4 · Retirar no condensables</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: RETIRAR NO CONDENSABLES</text>
  </g>

  <!-- Content area -->
  
    <!-- Condenser Shell Outer Body -->
    <rect x="220" y="140" width="560" height="280" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="3" filter="url(#cardShadow)"/>
    
    <!-- Steam Inlet Neck at Top -->
    <g id="cond-steam" >
      <path d="M 360 90 L 360 140 L 640 140 L 640 90 Z" fill="#fee2e2" stroke="#e11d48" stroke-width="2.5"/>
      <path d="M 430 95 L 430 135 M 500 95 L 500 135 M 570 95 L 570 135" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>
      <rect x="400" y="75" width="200" height="24" rx="6" fill="#e11d48"/>
      <text x="500" y="91" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">ESCAPE TURBINA BP (~0.05 bar abs)</text>
      
      <!-- Impingement Baffle -->
      <path d="M 400 160 Q 500 175 600 160" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <text x="500" y="154" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#64748b">DEFLECTOR DE IMPACTO (PROTEGE TUBOS)</text>
    </g>

    <!-- Tube Bank / Cooling Water Circuit -->
    <g id="cond-cooling" >
      <!-- Water boxes -->
      <path d="M 220 160 L 140 180 L 140 260 L 220 280 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M 220 280 L 140 300 L 140 380 L 220 400 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M 780 160 L 850 180 L 850 400 L 780 400 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      
      <!-- SW inlet / outlet pipes -->
      <path d="M 60 340 L 140 340" stroke="#0284c7" stroke-width="6" marker-end="url(#arrowBlue)"/>
      <text x="70" y="325" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1">ENTRADA AGUA MAR (20°C)</text>
      
      <path d="M 140 220 L 60 220" stroke="#0ea5e9" stroke-width="6" marker-end="url(#arrowBlue)"/>
      <text x="70" y="205" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0284c7">SALIDA AGUA MAR (28°C)</text>

      <!-- Tube bundle grid (representing multitubular condenser) -->
      <circle cx="270" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="185" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="270" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="217" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="270" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="249" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="270" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="281" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="270" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="313" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="270" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="345" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="270" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="308" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="346" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="384" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="422" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="460" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="498" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="536" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="574" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="612" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="650" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><circle cx="688" cy="377" r="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
      <text x="500" y="295" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369a1" opacity="0.85">HAZ MULTITUBULAR DE SUPERFICIE (CU-NI / TITANIO)</text>
    </g>

    <!---->
    <g id="cond-air" filter="url(#activeGlow)">
      <!-- Air baffle isolating cooler tubes -->
      <path d="M 660 210 L 660 380 L 740 380" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="4 2"/>
      <rect x="670" y="230" width="80" height="130" rx="6" fill="#ccfbf1" opacity="0.4"/>
      
      <!-- Suction line to ejector -->
      <path d="M 720 280 L 880 280 L 880 170" stroke="#d97706" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
      <rect x="830" y="105" width="120" height="65" rx="8" fill="#f0fdfa" stroke="#d97706" stroke-width="2"/>
      <text x="890" y="125" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">EYECTOR DE AIRE</text>
      <text x="890" y="142" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#134e4a">Extracción de aire y</text>
      <text x="890" y="156" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#134e4a">gases no condensables</text>
    </g>

    <!---->
    <g id="cond-condensate" >
      <!-- Hotwell Sump -->
      <path d="M 380 420 L 420 480 L 580 480 L 620 420 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
      <text x="500" y="455" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af">POZO CALIENTE (HOTWELL)</text>
      <text x="500" y="470" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" fill="#1d4ed8">Agua condensada pura ~32-35°C</text>

      <!-- Suction to Condensate Pump -->
      <path d="M 500 480 L 500 525 L 360 525" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
      <!-- Condensate Extraction Pump (CEP) -->
      <circle cx="320" cy="525" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
      <path d="M 308 515 L 332 525 L 308 535 Z" fill="#2563eb"/>
      <text x="320" y="560" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">BOMBA EXTRACCIÓN (CEP)</text>
      
      <!-- Discharge to feed heaters / deaerator -->
      <path d="M 298 525 L 140 525" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
      <text x="135" y="515" text-anchor="end" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">Hacia desaireador</text>
    </g>

    <!-- Explanatory Bottom Card for Active Step -->
    <g transform="translate(60, 480)" filter="url(#activeGlow)">
      <rect x="580" y="15" width="370" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="600" y="38" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">PRINCIPIO DEL CONDENSADOR NAVAL</text>
      <text x="600" y="56" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" fill="#475569">Condensación de superficie: el vapor se licúa al ceder calor latente</text>
      <text x="600" y="70" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" fill="#475569">al agua de mar sin contacto directo, manteniendo vacío profundo.</text>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#e11d48"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Vapor de escape (BP)</text>
    <circle cx="190" cy="17" r="5" fill="#0284c7"/><text x="202" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Agua de circulación (mar)</text>
    <circle cx="390" cy="17" r="5" fill="#0d9488"/><text x="402" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Extracción no condensables</text>
    <circle cx="610" cy="17" r="5" fill="#2563eb"/><text x="622" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Pozo caliente / Condensado</text>
    <circle cx="820" cy="17" r="5" fill="#d97706"/><text x="832" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco activo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>