<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>metal</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Seguir el calor desde la llama hasta el agua</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 3 de 4 · Conducción a través del metal</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><rect x="90" y="170" width="170" height="210" rx="12" fill="#cb6c32" stroke="#729084" stroke-width="2"/><text x="102" y="281.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="90" y="415" font-family="Arial,sans-serif" font-size="15" fill="#193f3e">Llama / gases</text><rect x="280" y="170" width="70" height="210" rx="12" fill="#706451" stroke="#729084" stroke-width="2"/><text x="292" y="281.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="280" y="415" font-family="Arial,sans-serif" font-size="15" fill="#193f3e">Hollín</text><rect x="370" y="170" width="110" height="210" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="382" y="281.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="370" y="415" font-family="Arial,sans-serif" font-size="15" fill="#193f3e">Metal</text><rect x="500" y="170" width="90" height="210" rx="12" fill="#ddc995" stroke="#729084" stroke-width="2"/><text x="512" y="281.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="500" y="415" font-family="Arial,sans-serif" font-size="15" fill="#193f3e">Incrustación</text><rect x="610" y="170" width="240" height="210" rx="12" fill="#d1e6ee" stroke="#729084" stroke-width="2"/><text x="622" y="281.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="610" y="415" font-family="Arial,sans-serif" font-size="15" fill="#193f3e">Agua</text><polyline points="100,280 830,280" fill="none" stroke="#ab7625" stroke-width="8" stroke-linejoin="round"/><polygon points="830,280 817.3937405670625,286.08951747755725 817.3937405670625,273.91048252244275" fill="#ab7625"/><rect x="150" y="455" width="700" height="70" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="162" y="496.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Depósitos → más resistencia térmica → peor refrigeración del metal</text><text x="90" y="143" font-family="Arial,sans-serif" font-size="18" fill="#193f3e">Capas del intercambio: gases → depósito → pared → depósito → agua</text><text x="90" y="555" font-family="Arial,sans-serif" font-size="15" fill="#193f3e">Corte conceptual de una pared: gases y agua permanecen separados.</text></svg>