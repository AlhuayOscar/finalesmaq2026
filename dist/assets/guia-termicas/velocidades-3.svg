<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>peripheral</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Construir el triángulo de velocidades</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 3 de 4 · Relacionar con trabajo</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><polyline points="230,445 610,445" fill="none" stroke="#ab7625" stroke-width="9" stroke-linejoin="round"/><polygon points="610,445 597.3937405670625,451.08951747755725 597.3937405670625,438.91048252244275" fill="#ab7625"/><polyline points="610,445 745,180" fill="none" stroke="#287eb1" stroke-width="6" stroke-linejoin="round"/><polygon points="745,180 744.7036944254531,193.9968640418664 733.8516932468162,188.46848608293817" fill="#287eb1"/><polyline points="230,445 745,180" fill="none" stroke="#bb5271" stroke-width="6" stroke-linejoin="round"/><polygon points="745,180 736.5768886357881,191.1826291607155 731.0044556701786,180.35318396339875" fill="#bb5271"/><text x="365" y="487" font-family="Arial,sans-serif" font-size="22" fill="#cb6c32">U: periférica</text><text x="685" y="345" font-family="Arial,sans-serif" font-size="20" fill="#287eb1">W: relativa</text><text x="265" y="262" font-family="Arial,sans-serif" font-size="22" fill="#bb5271">C: absoluta</text><rect x="160" y="100" width="390" height="65" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="172" y="138.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">C = U + W (vectores)</text><text x="160" y="547" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Triángulo ilustrativo; construir uno a la entrada y otro a la salida.</text></svg>