<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Entender barrido, encendido y calentamiento</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Confirmar encendido y llama</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: CONFIRMAR ENCENDIDO Y LLAMA</text>
  </g>

  <!-- Content area -->
  
    <g transform="translate(50, 105)">
      
        <g id="phase-1" >
          <rect x="0" y="0" width="435" height="195" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
          
          <rect x="0" y="0" width="435" height="34" rx="14" fill="#334155"/>
          <rect x="0" y="18" width="435" height="16" fill="#334155"/>
          <text x="20" y="22" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">FASE 01 · ELIMINAR MEZCLAS REMANENTES</text>
          
          <!-- Pure SVG multi-line text (no foreignObject) -->
          <g transform="translate(20, 58)">
            
    <text x="0" y="0" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">El barrido renueva el ambiente del hogar antes de</text>
  
    <text x="0" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">admitir combustible. Su cumplimiento exige las</text>
  
    <text x="0" y="36" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">condiciones verificadas por el sistema, como tiro</text>
  
    <text x="0" y="54" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">y secuencia prevista; no se demuestra solamente</text>
  
    <text x="0" y="72" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">contando unos segundos.</text>
  
          </g>
        </g>
        
        <g id="phase-2" filter="url(#activeGlow)">
          <rect x="455" y="0" width="435" height="195" rx="14" fill="url(#activeGrad)" stroke="#d97706" stroke-width="3.5" filter="url(#cardShadow)"/>
          
          <rect x="455" y="0" width="435" height="34" rx="14" fill="#d97706"/>
          <rect x="455" y="18" width="435" height="16" fill="#d97706"/>
          <text x="475" y="22" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">FASE 02 · CONFIRMAR ENCENDIDO Y LLAMA</text>
          
          <!-- Pure SVG multi-line text (no foreignObject) -->
          <g transform="translate(475, 58)">
            
    <text x="0" y="0" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">El sistema debe supervisar el establecimiento de</text>
  
    <text x="0" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">llama. Una falla de encendido o pérdida de llama</text>
  
    <text x="0" y="36" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">exige la respuesta de protección y la</text>
  
    <text x="0" y="54" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">investigación previstas; repetir intentos sin</text>
  
    <text x="0" y="72" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">nuevo barrido y permisos puede acumular</text>
  
    <text x="0" y="90" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">combustible.</text>
  
          </g>
        </g>
        
        <g id="phase-3" >
          <rect x="0" y="220" width="435" height="195" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
          
          <rect x="0" y="220" width="435" height="34" rx="14" fill="#334155"/>
          <rect x="0" y="238" width="435" height="16" fill="#334155"/>
          <text x="20" y="242" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">FASE 03 · AUMENTAR GRADUALMENTE EL APORTE</text>
          
          <!-- Pure SVG multi-line text (no foreignObject) -->
          <g transform="translate(20, 278)">
            
    <text x="0" y="0" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">El calentamiento progresivo limita diferencias de</text>
  
    <text x="0" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">dilatación y tensiones en metal y refractarios.</text>
  
    <text x="0" y="36" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">Venteos evacuan aire y se cierran cuando el</text>
  
    <text x="0" y="54" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">procedimiento y las condiciones lo indican, no por</text>
  
    <text x="0" y="72" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">una regla universal.</text>
  
          </g>
        </g>
        
        <g id="phase-4" >
          <rect x="455" y="220" width="435" height="195" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
          
          <rect x="455" y="220" width="435" height="34" rx="14" fill="#334155"/>
          <rect x="455" y="238" width="435" height="16" fill="#334155"/>
          <text x="475" y="242" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">FASE 04 · CUIDAR SUPERFICIES CON POCO CAUDAL</text>
          
          <!-- Pure SVG multi-line text (no foreignObject) -->
          <g transform="translate(475, 278)">
            
    <text x="0" y="0" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">Durante el arranque hay fuego pero puede haber</text>
  
    <text x="0" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">poco vapor circulando por el sobrecalentador.</text>
  
    <text x="0" y="36" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">Identificá circulación, drenajes y protección del</text>
  
    <text x="0" y="54" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">diseño; la ausencia de carga no significa ausencia</text>
  
    <text x="0" y="72" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="normal" fill="#1e293b">de riesgo térmico.</text>
  
          </g>
        </g>
        

      <path d="M 440 95 L 500 95" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowGray)"/>
      <path d="M 890 95 Q 930 95 930 150 T 890 205 L 440 205 Q 400 205 400 260 T 440 315" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
      <path d="M 440 315 L 500 315" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowGray)"/>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Fases previas</text>
    <circle cx="160" cy="17" r="5" fill="#d97706"/><text x="172" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Fase activa actual del procedimiento</text>
    <circle cx="480" cy="17" r="5" fill="#64748b"/><text x="492" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Fases posteriores del protocolo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>