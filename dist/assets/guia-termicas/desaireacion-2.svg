<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Desairear sin provocar problemas en aspiración</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Evacuar los gases separados</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: EVACUAR LOS GASES SEPARADOS</text>
  </g>

  <!-- Content area -->
  
    <g transform="translate(60, 100)">
      <g id="deaerator-dome" >
        <rect x="360" y="30" width="180" height="130" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
        <text x="450" y="55" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">CÚPULA DESAIREADORA</text>
        
          <line x1="390" y1="75" x2="510" y2="75" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4"/>
        
          <line x1="390" y1="95" x2="510" y2="95" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4"/>
        
          <line x1="390" y1="115" x2="510" y2="115" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4"/>
        
        <text x="450" y="145" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#0284c7">Cascada de bandejas perforadas</text>
      </g>

      <g id="deaerator-vent" filter="url(#activeGlow)">
        <path d="M 450 30 L 450 5 L 560 5" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrowGray)"/>
        <text x="575" y="10" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">Venteo de gases incondensables (O2 / CO2)</text>
      </g>

      <path d="M 100 80 L 360 80" fill="none" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
      <text x="120" y="70" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7">Ingreso condensado (spray)</text>

      <path d="M 780 110 L 540 110" fill="none" stroke="#e11d48" stroke-width="3.5" marker-end="url(#arrowRed)"/>
      <text x="640" y="100" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e11d48">Vapor de calentamiento</text>

      <g id="deaerator-tank" >
        <rect x="220" y="160" width="460" height="130" rx="30" fill="url(#drumGrad)" stroke="#0284c7" stroke-width="2.5"/>
        <text x="450" y="195" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">TANQUE DE ALMACENAMIENTO DE AGUA DESAIREADA</text>
        <text x="450" y="215" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#0369a1">Reserva térmica presurizada para caldera</text>
      </g>

      <g id="deaerator-pump" >
        <path d="M 450 290 L 450 390 L 560 390" fill="none" stroke="#059669" stroke-width="4.5" marker-end="url(#arrowGreen)"/>
        <circle cx="585" cy="390" r="25" fill="#dcfce7" stroke="#059669" stroke-width="3"/>
        <polygon points="575,375 600,390 575,405" fill="#059669"/>
        <text x="625" y="395" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">BOMBA DE ALIMENTACIÓN PRINCIPAL</text>
        <line x1="410" y1="290" x2="410" y2="390" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="320" y="345" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Altura estática H</text>
        <text x="260" y="360" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#b45309">Garantiza NPSHd &gt; NPSHr (evita cavitación)</text>
      </g>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Condensado / Agua</text>
    <circle cx="190" cy="17" r="5" fill="#e11d48"/><text x="202" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Vapor de calentamiento</text>
    <circle cx="410" cy="17" r="5" fill="#475569"/><text x="422" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Venteo de gases (O2 / CO2)</text>
    <circle cx="630" cy="17" r="5" fill="#059669"/><text x="642" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Bomba alimentación (NPSH)</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>