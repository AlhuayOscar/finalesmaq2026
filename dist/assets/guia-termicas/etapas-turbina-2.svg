<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Seguir la expansión y la entrega de par</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Transferir cantidad de movimiento</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: TRANSFERIR CANTIDAD DE MOVIMIENTO</text>
  </g>

  <!-- Content area -->
  
    <g transform="translate(60, 110)">
      <path d="M 80 80 L 800 20 L 800 360 L 80 300 Z" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
      <rect x="40" y="170" width="820" height="40" rx="6" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
      <text x="450" y="195" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">EJE DEL ROTOR DE LA TURBINA</text>

      <g id="turb-stator" >
        
          <rect x="180" y="85" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
          <rect x="180" y="210" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
        
          <rect x="360" y="85" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
          <rect x="360" y="210" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
        
          <rect x="540" y="85" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
          <rect x="540" y="210" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
        
          <rect x="700" y="85" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
          <rect x="700" y="210" width="24" height="85" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
        
        <text x="190" y="70" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7">ÁLABES FIJOS (TOBERAS)</text>
      </g>

      <g id="turb-rotor" filter="url(#activeGlow)">
        
          <rect x="250" y="70" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
          <rect x="250" y="210" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
        
          <rect x="430" y="70" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
          <rect x="430" y="210" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
        
          <rect x="610" y="70" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
          <rect x="610" y="210" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
        
          <rect x="760" y="70" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
          <rect x="760" y="210" width="24" height="100" rx="4" fill="#d97706" stroke="#c2410c" stroke-width="1.5"/>
        
        <text x="260" y="55" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea580c">ÁLABES MÓVILES</text>
      </g>

      <g id="turb-exhaust" >
        <path d="M 50 120 L 850 120" stroke="#e11d48" stroke-width="4" stroke-dasharray="8 4" marker-end="url(#arrowRed)"/>
        <text x="70" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e11d48">Vapor vivo (AP)</text>
        <text x="770" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e11d48">Escape a condensador</text>
      </g>
    </g>

    <g id="turb-pressure"  transform="translate(60, 480)">
      <rect width="880" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="20" y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">ETAPAS DE ACCIÓN VS REACCIÓN</text>
      <text x="20" y="44" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">• Acción (Rateau/Curtis): Caída de presión y aceleración exclusiva en toberas fijas; álabe móvil desvía flujo sin caída de presión.</text>
      <text x="20" y="62" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">• Reacción (Parsons): Caída de presión repartida al 50% entre álabes fijos y móviles; expansión acelerada en el rotor genera empuje reactivo.</text>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Estator / Toberas fijas</text>
    <circle cx="220" cy="17" r="5" fill="#ea580c"/><text x="232" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Rotor / Álabes móviles</text>
    <circle cx="430" cy="17" r="5" fill="#e11d48"/><text x="442" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Vapor de entrada / escape</text>
    <circle cx="680" cy="17" r="5" fill="#d97706"/><text x="692" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco activo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>