<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>rotor</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Seguir la expansión y la entrega de par</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 2 de 4 · Transferir cantidad de movimiento</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><rect x="120" y="150" width="760" height="310" rx="12" fill="#e5e9df" stroke="#729084" stroke-width="2"/><text x="132" y="311.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Carcasa</text><polyline points="100,340 900,340" fill="none" stroke="#ab7625" stroke-width="17" stroke-linejoin="round"/><polygon points="250,220 285,240 262,275" fill="#8baaa5"/><polygon points="250,280 285,300 262,335" fill="#8baaa5"/><polygon points="330,250 360,230 350,290" fill="#ab7625"/><polygon points="330,310 360,290 350,350" fill="#ab7625"/><polygon points="450,220 485,240 462,275" fill="#8baaa5"/><polygon points="450,280 485,300 462,335" fill="#8baaa5"/><polygon points="530,250 560,230 550,290" fill="#ab7625"/><polygon points="530,310 560,290 550,350" fill="#ab7625"/><polygon points="650,220 685,240 662,275" fill="#8baaa5"/><polygon points="650,280 685,300 662,335" fill="#8baaa5"/><polygon points="730,250 760,230 750,290" fill="#ab7625"/><polygon points="730,310 760,290 750,350" fill="#ab7625"/><polyline points="100,200 870,200" fill="none" stroke="#bb5271" stroke-width="5" stroke-linejoin="round"/><polygon points="870,200 857.3937405670625,206.08951747755722 857.3937405670625,193.91048252244278" fill="#bb5271"/><text x="135" y="503" font-family="Arial,sans-serif" font-size="18" fill="#193f3e">Fijos: orientan / expanden     Móviles: intercambio de momento y par</text><text x="180" y="140" font-family="Arial,sans-serif" font-size="20" fill="#193f3e">Entrada de vapor → sucesivas filas → escape</text></svg>