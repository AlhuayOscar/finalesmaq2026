<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>discharge</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Entender medición y protección de presión</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 4 de 4 · Distinguir tres comprobaciones</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><polyline points="150,420 850,420" fill="none" stroke="#ab7625" stroke-width="13" stroke-linejoin="round"/><polygon points="850,420 837.3937405670625,426.08951747755725 837.3937405670625,413.91048252244275" fill="#ab7625"/><rect x="380" y="240" width="200" height="180" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="392" y="336.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Cuerpo</text><rect x="420" y="140" width="120" height="95" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="432" y="193.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Resorte</text><polyline points="480,235 480,355" fill="none" stroke="#193f3e" stroke-width="6" stroke-linejoin="round"/><polyline points="410,355 550,355" fill="none" stroke="#ab7625" stroke-width="12" stroke-linejoin="round"/><circle cx="210" cy="280" r="50" fill="#d9eaf4" stroke="#287eb1" stroke-width="4"/><polyline points="210,330 210,420" fill="none" stroke="#287eb1" stroke-width="4" stroke-linejoin="round"/><polyline points="210,280 235,250" fill="none" stroke="#193f3e" stroke-width="3" stroke-linejoin="round"/><text x="130" y="219" font-family="Arial,sans-serif" font-size="19" fill="#193f3e">Manómetro</text><polyline points="580,290 820,290 820,160" fill="none" stroke="#ab7625" stroke-width="8" stroke-linejoin="round"/><polygon points="820,160 826.0895174775573,172.60625943293746 813.9104825224427,172.60625943293746" fill="#ab7625"/><text x="710" y="136" font-family="Arial,sans-serif" font-size="21" fill="#193f3e">Descarga</text><text x="125" y="488" font-family="Arial,sans-serif" font-size="18" fill="#193f3e">Entrada: presión actúa sobre el obturador. El resorte se opone a la apertura.</text></svg>