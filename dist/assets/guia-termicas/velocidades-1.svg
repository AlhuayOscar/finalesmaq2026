<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Construir el triángulo de velocidades</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 1 de 4 · Elegir el sistema de referencia</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: ELEGIR EL SISTEMA DE REFERENCIA</text>
  </g>

  <!-- Content area -->
  
    <g transform="translate(100, 100)">
      <path d="M 400 340 C 450 310 470 260 460 210 C 450 160 410 130 380 110" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
      <text x="480" y="230" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b">ÁLABE MÓVIL</text>

      <g id="tri-inlet">
        <text x="120" y="60" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f2922">TRIÁNGULO DE ENTRADA (ESTACIÓN 1)</text>
        
        <g id="tri-abs" filter="url(#activeGlow)">
          <line x1="100" y1="260" x2="380" y2="110" stroke="#d97706" stroke-width="6" marker-end="url(#arrowRed)"/>
          <text x="210" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e11d48">C1 (Absoluta)</text>
        </g>

        <g id="tri-peri" >
          <line x1="100" y1="260" x2="300" y2="260" stroke="#ea580c" stroke-width="4.5" marker-end="url(#arrowOrange)"/>
          <text x="180" y="290" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ea580c">U (Vel. del álabe)</text>
        </g>

        <g id="tri-rel" >
          <line x1="300" y1="260" x2="380" y2="110" stroke="#0284c7" stroke-width="4.5" marker-end="url(#arrowBlue)"/>
          <text x="350" y="200" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0284c7">W1 (Relativa)</text>
        </g>
      </g>

      <g id="tri-work"  transform="translate(100, 330)">
        <rect width="600" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
        <text x="300" y="32" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f2922">ECUACIÓN DE EULER PARA TURBOMAQUINARIA</text>
        <text x="300" y="58" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">Trabajo específico w = U · (C1u - C2u) [kJ/kg]</text>
        <text x="300" y="78" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#64748b">La variación de la componente tangencial de la velocidad produce el par motor sobre el rotor.</text>
      </g>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#e11d48"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">C: Velocidad absoluta (salida tobera)</text>
    <circle cx="310" cy="17" r="5" fill="#ea580c"/><text x="322" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">U: Velocidad tangencial (álabe)</text>
    <circle cx="580" cy="17" r="5" fill="#0284c7"/><text x="592" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">W: Velocidad relativa</text>
    <circle cx="780" cy="17" r="5" fill="#d97706"/><text x="792" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco activo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>