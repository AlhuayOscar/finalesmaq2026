<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Reconstruir la caldera A del apunte</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 1 de 4 · Contar colectores</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: CONTAR COLECTORES</text>
  </g>

  <!-- Content area -->
  
  <!-- Domo superior central -->
  <g id="domo-a" filter="url(#activeGlow)">
    <rect x="380" y="95" width="240" height="70" rx="20" fill="url(#activeGrad)" stroke="#d97706" stroke-width="4"/>
    <text x="500" y="126" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">DOMO SUPERIOR (CENTRAL)</text>
    <text x="500" y="142" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#0369a1">Separación de vapor y agua</text>
  </g>

  <!-- Colector inferior izquierdo -->
  <g id="colector-a-izq" filter="url(#activeGlow)">
    <rect x="130" y="440" width="180" height="60" rx="18" fill="url(#activeGrad)" stroke="#d97706" stroke-width="4"/>
    <text x="220" y="468" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">COLECTOR LATERAL IZQ.</text>
    <text x="220" y="484" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#0369a1">Alimentación haz izq.</text>
  </g>

  <!-- Colector inferior derecho -->
  <g id="colector-a-der" filter="url(#activeGlow)">
    <rect x="690" y="440" width="180" height="60" rx="18" fill="url(#activeGrad)" stroke="#d97706" stroke-width="4"/>
    <text x="780" y="468" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">COLECTOR LATERAL DER.</text>
    <text x="780" y="484" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#0369a1">Alimentación haz der.</text>
  </g>

  <!-- Tubos descendentes (Downcomers) hacia ambos lados -->
  <g id="downcomers-a" >
    <path d="M 400 160 L 100 160 L 100 460 L 130 460" fill="none" stroke="#0284c7" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 600 160 L 900 160 L 900 460 L 870 460" fill="none" stroke="#0284c7" stroke-width="5" stroke-linejoin="round"/>
    <text x="60" y="310" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1">DESCENDENTE IZQ.</text>
    <text x="830" y="310" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1">DESCENDENTE DER.</text>
  </g>

  <!-- Haces generadores simétricos formando la A -->
  <g id="risers-a" >
    <!-- Haz izquierdo -->
    
      <line x1="200" y1="440" x2="420" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
      <line x1="215" y1="440" x2="430.5" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
      <line x1="230" y1="440" x2="441" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
      <line x1="245" y1="440" x2="451.5" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Haz derecho -->
    
      <line x1="750" y1="440" x2="530" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
      <line x1="765" y1="440" x2="540.5" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
      <line x1="780" y1="440" x2="551" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
      <line x1="795" y1="440" x2="561.5" y2="165" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    
  </g>

  <!-- Hogar central en la V invertida -->
  <g id="furnace-a" >
    <rect x="370" y="240" width="260" height="190" rx="14" fill="url(#furnaceGrad)" stroke="#fed7aa" stroke-width="2"/>
    <text x="500" y="268" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#9a3412">HOGAR CENTRAL</text>
    <text x="500" y="284" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#c2410c">Gases divididos hacia ambos haces</text>
    <!-- Llama central -->
    <path d="M 500 380 C 470 380 455 350 475 320 C 485 305 500 300 500 290 C 505 305 520 320 525 335 C 535 360 525 380 500 380 Z" fill="#f97316"/>
    <path d="M 500 380 C 485 380 475 365 485 345 C 490 335 500 330 500 320 C 505 330 510 340 515 350 C 520 365 515 380 500 380 Z" fill="#facc15"/>
  </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/>
    <text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">1 domo sup. + 2 colectores inf.</text>
    <circle cx="250" cy="17" r="5" fill="#ea580c"/>
    <text x="262" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Dos haces simétricos en A</text>
    <circle cx="480" cy="17" r="5" fill="#d97706"/>
    <text x="492" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Componente activo del paso</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>