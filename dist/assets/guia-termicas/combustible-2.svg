<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Preparar combustible antes de pulverizar</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Impulsar, calentar y filtrar</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: IMPULSAR, CALENTAR Y FILTRAR</text>
  </g>

  <!-- Content area -->
  
    <!-- Connecting pipes -->
    <g stroke-linecap="round">
      
        <line x1="420" y1="180" x2="560" y2="180" stroke="#d97706" stroke-width="4.5" marker-end="url(#arrowOrange)"/>
        <rect x="415" y="168" width="150" height="22" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="490" y="183" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Fuel oil hacia calentamiento</text>
      
        <line x1="720" y1="250" x2="720" y2="350" stroke="#e11d48" stroke-width="4.5" marker-end="url(#arrowRed)"/>
        <rect x="645" y="288" width="150" height="22" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="720" y="303" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Combustible caliente a baja viscosidad</text>
      
        <line x1="560" y1="420" x2="420" y2="420" stroke="#0284c7" stroke-width="4.5" marker-end="url(#arrowBlue)"/>
        <rect x="415" y="408" width="150" height="22" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="490" y="423" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Alimentación presurizada a quemador</text>
      
        <line x1="260" y1="350" x2="260" y2="250" stroke="#ea580c" stroke-width="4.5" marker-end="url(#arrowOrange)"/>
        <rect x="185" y="288" width="150" height="22" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="260" y="303" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#1e293b">Retorno recirculación de servicio</text>
      
    </g>

    <!-- Stations Cards -->
    
      <g id="station-tank" >
        <rect x="100" y="110" width="320" height="140" rx="14" fill="url(#steelGrad)" stroke="#d97706" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="100" y="110" width="320" height="36" rx="14" fill="#d97706"/>
        <rect x="100" y="130" width="320" height="16" fill="#d97706"/>
        <text x="260" y="133" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ALMACENAMIENTO Y SERVICIO</text>
        
          <text x="120" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Tanque de sedimentación y servicio diario</text>
        
          <text x="120" y="190" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Decantación de agua y lodos</text>
        
          <text x="120" y="210" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Temperatura de bombeo inicial</text>
        
      </g>
      
      <g id="station-heater" filter="url(#activeGlow)">
        <rect x="560" y="110" width="320" height="140" rx="14" fill="url(#activeGrad)" stroke="#d97706" stroke-width="3.5" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="560" y="110" width="320" height="36" rx="14" fill="#e11d48"/>
        <rect x="560" y="130" width="320" height="16" fill="#e11d48"/>
        <text x="720" y="133" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">BOMBA Y CALENTADOR DE FO</text>
        
          <text x="580" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Bomba de presurización de circuito</text>
        
          <text x="580" y="190" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Calentador de vapor para viscosidad</text>
        
          <text x="580" y="210" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Control de viscosímetro automático</text>
        
      </g>
      
      <g id="station-filter" >
        <rect x="560" y="350" width="320" height="140" rx="14" fill="url(#steelGrad)" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="560" y="350" width="320" height="36" rx="14" fill="#0284c7"/>
        <rect x="560" y="370" width="320" height="16" fill="#0284c7"/>
        <text x="720" y="373" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">FILTROS FINOS Y DESGASIFICADOR</text>
        
          <text x="580" y="410" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Retención de partículas abrasivas</text>
        
          <text x="580" y="430" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Desaireación y cámara de mezcla</text>
        
          <text x="580" y="450" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Válvula reguladora de contrapresión</text>
        
      </g>
      
      <g id="station-nozzle" >
        <rect x="100" y="350" width="320" height="140" rx="14" fill="url(#steelGrad)" stroke="#ea580c" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Header bar -->
        <rect x="100" y="350" width="320" height="36" rx="14" fill="#ea580c"/>
        <rect x="100" y="370" width="320" height="16" fill="#ea580c"/>
        <text x="260" y="373" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">PULVERIZADOR / QUEMADOR</text>
        
          <text x="120" y="410" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• Atomización mecánica o por vapor</text>
        
          <text x="120" y="430" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Formación de niebla de microgotas</text>
        
          <text x="120" y="450" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e293b">• Combustión en el hogar sin retorno</text>
        
      </g>
      
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
      <circle cx="20" cy="17" r="5" fill="#d97706"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Almacenamiento</text>
      <circle cx="170" cy="17" r="5" fill="#e11d48"/><text x="182" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Calentamiento</text>
      <circle cx="310" cy="17" r="5" fill="#0284c7"/><text x="322" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Filtrado fino</text>
      <circle cx="430" cy="17" r="5" fill="#ea580c"/><text x="442" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Pulverizador</text>
      <circle cx="560" cy="17" r="5" fill="#d97706"/><text x="572" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Componente activo</text>
    
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>