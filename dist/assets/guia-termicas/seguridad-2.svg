<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Entender medición y protección de presión</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Explicar la fuerza de apertura</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: EXPLICAR LA FUERZA DE APERTURA</text>
  </g>

  <!-- Content area -->
  
    <g transform="translate(60, 100)">
      <g id="gauge-group"  transform="translate(40, 40)">
        <rect width="260" height="340" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
        <text x="130" y="32" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0284c7">MEDICIÓN DE PRESIÓN</text>
        <circle cx="130" cy="110" r="55" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
        <circle cx="130" cy="110" r="4" fill="#e11d48"/>
        <line x1="130" y1="110" x2="160" y2="85" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
        <text x="130" y="145" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">bar / kg/cm²</text>
        <path d="M 130 165 L 130 200 C 170 200 170 240 130 240 C 90 240 90 200 130 200 L 130 290" fill="none" stroke="#0284c7" stroke-width="4"/>
        <text x="130" y="270" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#0284c7">Sifón con sello condensado</text>
        <text x="130" y="315" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#475569">Protege el Bourdon del vapor vivo</text>
      </g>

      <g id="safety-valve-group" transform="translate(380, 20)">
        <rect width="480" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
        <text x="240" y="32" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f2922">VÁLVULA DE SEGURIDAD DE RESORTE</text>

        <path d="M 190 320 L 190 250 L 290 250 L 290 320 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
        <line x1="160" y1="320" x2="320" y2="320" stroke="#334155" stroke-width="5"/>
        <text x="240" y="340" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e11d48">ENTRADA DESDE EL DOMO</text>

        <g id="spring-part" filter="url(#activeGlow)">
          <rect x="200" y="70" width="80" height="150" rx="8" fill="url(#activeGrad)" stroke="#d97706" stroke-width="4"/>
          
            <path d="M 210 90 L 270 102" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
          
            <path d="M 210 115 L 270 127" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
          
            <path d="M 210 140 L 270 152" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
          
            <path d="M 210 165 L 270 177" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
          
            <path d="M 210 190 L 270 202" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
          
          <line x1="240" y1="50" x2="240" y2="240" stroke="#334155" stroke-width="6"/>
          <text x="310" y="150" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea580c">RESORTE CALIBRADO</text>
        </g>

        <g id="disc-part" >
          <rect x="205" y="240" width="70" height="18" rx="4" fill="#fecdd3" stroke="#e11d48" stroke-width="2.5"/>
          <text x="145" y="245" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#e11d48">Disco / Asiento</text>
          <text x="145" y="258" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#9f1239">Anillo blowdown</text>
        </g>

        <g id="discharge-part" >
          <path d="M 280 230 L 420 230 L 420 120" fill="none" stroke="#475569" stroke-width="4.5" marker-end="url(#arrowGray)"/>
          <text x="340" y="215" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Escape al exterior</text>
        </g>
      </g>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Manómetro y sifón</text>
    <circle cx="190" cy="17" r="5" fill="#ea580c"/><text x="202" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Resorte y vástago</text>
    <circle cx="360" cy="17" r="5" fill="#e11d48"/><text x="372" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Disco y tobera</text>
    <circle cx="500" cy="17" r="5" fill="#64748b"/><text x="512" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Descarga de alivio</text>
    <circle cx="680" cy="17" r="5" fill="#d97706"/><text x="692" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco activo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>