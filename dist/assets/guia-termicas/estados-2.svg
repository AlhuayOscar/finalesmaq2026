<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Reconocer el estado del agua y del vapor</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 2 de 4 · Dentro de la región de mezcla</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: DENTRO DE LA REGIÓN DE MEZCLA</text>
  </g>

  <!-- Content area -->
  
    <!-- Top 3 Phase Cards -->
    
      <g id="card-liquid" >
        <rect x="60" y="110" width="260" height="160" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="60" y="110" width="260" height="32" rx="12" fill="#0284c7"/>
        <rect x="60" y="128" width="260" height="14" fill="#0284c7"/>
        <text x="190" y="131" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1. LÍQUIDO SUBENFRIADO</text>
        <text x="76" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• T &lt; Tsat a la presión de trabajo</text>
        <text x="76" y="198" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#475569">• Calor sensible: eleva temperatura</text>
        <text x="76" y="226" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#475569">• Sin presencia de vapor</text>
      </g>
    
      <g id="card-wet" filter="url(#activeGlow)">
        <rect x="370" y="110" width="260" height="160" rx="12" fill="url(#activeGrad)" stroke="#d97706" stroke-width="3.5" filter="url(#cardShadow)"/>
        <rect x="370" y="110" width="260" height="32" rx="12" fill="#ea580c"/>
        <rect x="370" y="128" width="260" height="14" fill="#ea580c"/>
        <text x="500" y="131" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2. MEZCLA SATURADA</text>
        <text x="386" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• T = Tsat (equilibrio líquido-vapor)</text>
        <text x="386" y="198" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#475569">• Calor latente de vaporización</text>
        <text x="386" y="226" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#475569">• Título 0 ≤ x ≤ 1 (fracción vapor)</text>
      </g>
    
      <g id="card-superheat" >
        <rect x="680" y="110" width="260" height="160" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#cardShadow)"/>
        <rect x="680" y="110" width="260" height="32" rx="12" fill="#e11d48"/>
        <rect x="680" y="128" width="260" height="14" fill="#e11d48"/>
        <text x="810" y="131" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3. VAPOR SOBRECALENTADO</text>
        <text x="696" y="170" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">• T &gt; Tsat a la presión del sistema</text>
        <text x="696" y="198" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#475569">• Vapor seco + calor añadido</text>
        <text x="696" y="226" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#475569">• Grado sobrecalentamiento = T - Tsat</text>
      </g>
    

    <!-- Bottom Isobaric Curve Diagram (P = cte) -->
    <g id="diagram-pressure"  transform="translate(60, 300)">
      <rect width="880" height="230" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="30" y="32" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#133e36">PROCESO DE CALENTAMIENTO A PRESIÓN CONSTANTE (ISOBÁRICO)</text>
      
      <!-- Graph Axes -->
      <line x1="60" y1="180" x2="800" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
      <line x1="60" y1="180" x2="60" y2="50" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
      <text x="815" y="184" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Entalpía h / Calor aportado Q</text>
      <text x="40" y="44" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Temp. T</text>

      <!-- Curve -->
      <path d="M 80 160 L 250 100 L 580 100 L 760 60" fill="none" stroke="#e11d48" stroke-width="4"/>

      <!---->
      <circle cx="250" cy="100" r="5" fill="#0284c7"/>
      <text x="210" y="85" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0284c7">x = 0 (Líq. sat)</text>

      <circle cx="580" cy="100" r="5" fill="#e11d48"/>
      <text x="560" y="85" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#e11d48">x = 1 (Vap. sat. seco)</text>

      <line x1="60" y1="100" x2="250" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="15" y="104" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a3412">Tsat</text>

      <text x="350" y="125" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ea580c">Zona de evaporación (Tsat constante)</text>
      <text x="120" y="145" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#0284c7">Calor sensible</text>
      <text x="630" y="75" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#e11d48">Sobrecalentamiento ΔT</text>
      
      <!-- Formula badge -->
      <rect x="250" y="185" width="400" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="450" y="204" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">P absoluta = P manométrica + P atmosférica  |  Tsat obtenida de tabla de vapor</text>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#0284c7"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Líquido subenfriado</text>
    <circle cx="190" cy="17" r="5" fill="#ea580c"/><text x="202" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Mezcla bifásica (Tsat const.)</text>
    <circle cx="410" cy="17" r="5" fill="#e11d48"/><text x="422" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Vapor sobrecalentado</text>
    <circle cx="600" cy="17" r="5" fill="#d97706"/><text x="612" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco activo</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>