<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="activeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d97706" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2922" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="48%" stop-color="#e0f2fe"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="furnaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8faf7" stroke="#e2e8e0" stroke-width="1.5"/>

  <!---->
  <g transform="translate(36, 32)">
    <text font-family="'DM Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#133e36">Distinguir recuperación, economizador y caldera mixta</text>
    <text y="24" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#52796f">Paso 4 de 4 · Cerrar el balance de servicio</text>
  </g>

  <!-- Active Step Pill Badge -->
  <g transform="translate(670, 24)">
    <rect width="294" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#d97706"/>
    <text x="30" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">FOCO: CERRAR EL BALANCE DE SERVICIO</text>
  </g>

  <!-- Content area -->
  
    <!-- 1. Engine Exhaust Gas Duct (Left) -->
    <g id="recup-engine" >
      <!-- Diesel Engine Block Base -->
      <rect x="70" y="380" width="160" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
      <text x="150" y="420" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#334155">MOTOR PRINCIPAL</text>
      <text x="150" y="438" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" fill="#64748b">Diésel 2T / 4T Propulsor</text>

      <!-- Vertical Exhaust Duct to EGB -->
      <path d="M 150 380 L 150 120" stroke="#64748b" stroke-width="40" stroke-linecap="butt"/>
      <path d="M 150 370 L 150 130" stroke="#f1f5f9" stroke-width="32" stroke-linecap="butt"/>
      
      <!-- Exhaust gas flow arrows -->
      <path d="M 150 360 L 150 140" stroke="#ea580c" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowOrange)"/>
      <text x="150" y="260" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ea580c" transform="rotate(-90 150 260)">GASES DE ESCAPE (280°C - 330°C)</text>

      <!-- Bypass damper -->
      <line x1="135" y1="330" x2="165" y2="310" stroke="#dc2626" stroke-width="4"/>
      <text x="180" y="325" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#dc2626">Válvula bypass</text>
    </g>

    <!-- 2. Exhaust Gas Boiler / Heat Exchanger Casing -->
    <g id="recup-exchanger" >
      <rect x="250" y="110" width="220" height="260" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" filter="url(#cardShadow)"/>
      <text x="360" y="135" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369a1">CALDERA DE RECUPERACIÓN (EGB)</text>
      
      <!-- Finned Tube Banks (Economizer and Evaporator) -->
      
        <path d="M 270 160 L 450 160" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
        <line x1="285" y1="153" x2="285" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="305" y1="153" x2="305" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="325" y1="153" x2="325" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="345" y1="153" x2="345" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="365" y1="153" x2="365" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="385" y1="153" x2="385" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="405" y1="153" x2="405" y2="167" stroke="#0ea5e9" stroke-width="2"/><line x1="425" y1="153" x2="425" y2="167" stroke="#0ea5e9" stroke-width="2"/>
      
        <path d="M 270 200 L 450 200" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
        <line x1="285" y1="193" x2="285" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="305" y1="193" x2="305" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="325" y1="193" x2="325" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="345" y1="193" x2="345" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="365" y1="193" x2="365" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="385" y1="193" x2="385" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="405" y1="193" x2="405" y2="207" stroke="#0ea5e9" stroke-width="2"/><line x1="425" y1="193" x2="425" y2="207" stroke="#0ea5e9" stroke-width="2"/>
      
        <path d="M 270 240 L 450 240" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
        <line x1="285" y1="233" x2="285" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="305" y1="233" x2="305" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="325" y1="233" x2="325" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="345" y1="233" x2="345" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="365" y1="233" x2="365" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="385" y1="233" x2="385" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="405" y1="233" x2="405" y2="247" stroke="#0ea5e9" stroke-width="2"/><line x1="425" y1="233" x2="425" y2="247" stroke="#0ea5e9" stroke-width="2"/>
      
        <path d="M 270 280 L 450 280" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
        <line x1="285" y1="273" x2="285" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="305" y1="273" x2="305" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="325" y1="273" x2="325" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="345" y1="273" x2="345" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="365" y1="273" x2="365" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="385" y1="273" x2="385" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="405" y1="273" x2="405" y2="287" stroke="#0ea5e9" stroke-width="2"/><line x1="425" y1="273" x2="425" y2="287" stroke="#0ea5e9" stroke-width="2"/>
      
        <path d="M 270 320 L 450 320" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
        <line x1="285" y1="313" x2="285" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="305" y1="313" x2="305" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="325" y1="313" x2="325" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="345" y1="313" x2="345" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="365" y1="313" x2="365" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="385" y1="313" x2="385" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="405" y1="313" x2="405" y2="327" stroke="#0ea5e9" stroke-width="2"/><line x1="425" y1="313" x2="425" y2="327" stroke="#0ea5e9" stroke-width="2"/>
      
      <text x="360" y="225" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1" opacity="0.9">TUBOS DE ALETAS HELICOIDALES</text>
      <text x="360" y="355" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#0284c7">Aporte convectivo sin quemador</text>
    </g>

    <!-- 3. Auxiliary Fired Boiler / Burner Section (Composite) -->
    <g id="recup-burner" >
      <rect x="520" y="240" width="180" height="200" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" filter="url(#cardShadow)"/>
      <text x="610" y="265" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#c2410c">SECCIÓN AUXILIAR / QUEMADOR</text>
      
      <!---->
      <rect x="495" y="325" width="30" height="30" rx="4" fill="#334155"/>
      <path d="M 525 340 Q 560 320 600 340 Q 560 360 525 340 Z" fill="url(#furnaceGrad)" stroke="#ea580c" stroke-width="1.5"/>
      <text x="610" y="390" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#9a3412">Combustión auxiliar en puerto</text>
      <text x="610" y="405" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#9a3412">o ante déficit de vapor en viaje</text>
    </g>

    <!---->
    <g id="recup-steam" filter="url(#activeGlow)">
      <!-- Drum -->
      <rect x="560" y="110" width="340" height="95" rx="20" fill="url(#drumGrad)" stroke="#d97706" stroke-width="4" filter="url(#cardShadow)"/>
      <text x="730" y="145" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">DOMO SEPARADOR DE VAPOR</text>
      <text x="730" y="165" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#fecaca">Vapor de servicios generales (6 - 8 bar sat.)</text>

      <!-- Steam outlet pipe -->
      <path d="M 730 110 L 730 65 L 940 65" stroke="#e11d48" stroke-width="4" marker-end="url(#arrowRed)"/>
      <text x="850" y="55" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#e11d48">Hacia calefacción HFO y servicios</text>

      <!-- Forced circulation pump back to exchanger -->
      <circle cx="490" cy="410" r="18" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M 482 403 L 498 410 L 482 417 Z" fill="#0284c7"/>
      <text x="490" y="440" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0369a1">BOMBA CIRCULACIÓN</text>
      <path d="M 600 205 L 600 410 L 510 410" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M 472 410 L 360 410 L 360 370" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    </g>

    <!-- Bottom Technical Summary Card -->
    <g transform="translate(60, 485)">
      <rect width="880" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="24" y="25" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e293b">BALANCE OPERATIVO DE RECUPERACIÓN TÉRMICA NAVAL</text>
      <text x="24" y="45" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">• A velocidad de crucero (>70% MCR): Los gases del motor cubren el 100% de la demanda de vapor del buque sin quemar fuel.</text>
      <text x="24" y="61" font-family="'DM Sans', system-ui, sans-serif" font-size="10.5" fill="#475569">• En maniobra / puerto: La caldera auxiliar entra en automático para mantener la presión de la línea de servicios.</text>
    </g>
  

  <!-- Bottom Legend -->
  <g transform="translate(40, 574)">
    <rect x="0" y="0" width="920" height="34" rx="8" fill="#ffffff" stroke="#e2e8e0" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="5" fill="#64748b"/><text x="32" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Escape motor diésel</text>
    <circle cx="190" cy="17" r="5" fill="#0284c7"/><text x="202" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Banco recuperador aleteado</text>
    <circle cx="410" cy="17" r="5" fill="#ea580c"/><text x="422" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Quemador auxiliar (mixta)</text>
    <circle cx="630" cy="17" r="5" fill="#e11d48"/><text x="642" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Domo / Colector de vapor</text>
    <circle cx="850" cy="17" r="5" fill="#d97706"/><text x="862" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">Foco</text>
  
    <text x="760" y="21" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Esquema didáctico naval</text>
  </g>
</svg>