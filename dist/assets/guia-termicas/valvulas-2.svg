<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>check</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Identificar una válvula por lo que hace</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 2 de 4 · Permitir un solo sentido</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><rect x="65" y="140" width="390" height="175" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="233.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="80" y="170" font-family="Arial,sans-serif" font-size="18" fill="#193f3e">Globo: obturador / asiento</text><polyline points="90,265 425,265" fill="none" stroke="#287eb1" stroke-width="5" stroke-linejoin="round"/><polygon points="425,265 412.39374056706254,271.08951747755725 412.39374056706254,258.91048252244275" fill="#287eb1"/><polyline points="255,190 255,255" fill="none" stroke="#193f3e" stroke-width="5" stroke-linejoin="round"/><polyline points="215,255 295,255" fill="none" stroke="#193f3e" stroke-width="9" stroke-linejoin="round"/><polyline points="215,270 295,270" fill="none" stroke="#193f3e" stroke-width="3" stroke-linejoin="round"/><rect x="540" y="140" width="390" height="175" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="552" y="233.5" font-family="Arial,sans-serif" font-size="17" fill="#193f3e"></text><text x="555" y="170" font-family="Arial,sans-serif" font-size="18" fill="#193f3e">Retención: cierre por retorno</text><polyline points="565,265 900,265" fill="none" stroke="#ab7625" stroke-width="8" stroke-