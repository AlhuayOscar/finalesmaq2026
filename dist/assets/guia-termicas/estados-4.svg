<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>pressure</title><rect width="1000" height="620" rx="16" fill="#f6f7ef"/><text x="32" y="50" font-family="Arial,sans-serif" font-size="25" fill="#193f3e">Reconocer el estado del agua y del vapor</text><text x="32" y="82" font-family="Arial,sans-serif" font-size="17" fill="#5a7167">Paso 4 de 4 · Usar presión y nombres correctos</text><text x="32" y="587" font-family="Arial,sans-serif" font-size="15" fill="#5a7167">Esquema didáctico · sin escala · ocre: parte o relación que explica este paso</text><text x="32" y="608" font-family="Arial,sans-serif" font-size="13" fill="#5a7167">Las posiciones no sustituyen el plano del equipo. Flechas según leyenda de cada figura.</text><rect x="65" y="230" width="250" height="120" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="77" y="285.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Líquido</text><text x="77" y="307.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">subenfriado</text><polyline points="65,400 300,400" fill="none" stroke="#bb5271" stroke-width="5" stroke-linejoin="round"/><polygon points="300,400 287.39374056706254,406.08951747755725 287.39374056706254,393.91048252244275" fill="#bb5271"/><rect x="375" y="230" width="250" height="120" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="387" y="285.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Mezcla saturada</text><text x="387" y="307.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">0 ≤ x ≤ 1</text><polyline points="375,400 610,400" fill="none" stroke="#bb5271" stroke-width="5" stroke-linejoin="round"/><polygon points="610,400 597.3937405670625,406.08951747755725 597.3937405670625,393.91048252244275" fill="#bb5271"/><rect x="685" y="230" width="250" height="120" rx="12" fill="#e4ece7" stroke="#729084" stroke-width="2"/><text x="697" y="285.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">Vapor</text><text x="697" y="307.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">sobrecalentado</text><polyline points="685,400 920,400" fill="none" stroke="#bb5271" stroke-width="5" stroke-linejoin="round"/><polygon points="920,400 907.3937405670625,406.08951747755725 907.3937405670625,393.91048252244275" fill="#bb5271"/><text x="65" y="201" font-family="Arial,sans-serif" font-size="21" fill="#193f3e">A presión constante: agregar calor →</text><text x="375" y="386" font-family="Arial,sans-serif" font-size="16" fill="#193f3e">T = Tsat mientras cambia x</text><text x="690" y="388" font-family="Arial,sans-serif" font-size="18" fill="#193f3e">T &gt; Tsat</text><rect x="100" y="470" width="800" height="60" rx="12" fill="#ffedbd" stroke="#ab7625" stroke-width="4"/><text x="112" y="506.0" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">p absoluta → tabla → Tsat       ΔT sobrecalentamiento = T − Tsat</text></svg>