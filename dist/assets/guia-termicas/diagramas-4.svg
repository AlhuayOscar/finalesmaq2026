oke-linejoin="round"/><polygon points="710,410 703.9104825224427,397.39374056706254 716.0895174775573,397.39374056706254" fill="#4d8d64"/><polyline points="710,175 805,365" fill="none" stroke="#cb6c32" stroke-width="5" stroke-linejoin="round"/><polygon points="805,365 793.9156793811944,356.44793379237973 804.8089394051872,351.00130378038335" fill="#cb6c32"/><text x="730" y="286" font-family="Arial,sans-serif" font-size="16" fill="#cb6c32">Real</text><text x="630" y="296" font-family="Arial,sans-serif" font-size="16" fill="#4d8d64">Ideal</text><circle cx="710" cy="410" r="7" fill="#d9eaf4" stroke="#ab7625" stroke-width="4"/><text x="270" y="492" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">x=0</text><text x="730" y="492" font-family="Arial,sans-serif" font-size="17" fill="#193f3e">x=1</text><text x="170" y="551" font-family="Arial,sans-serif" font-size="16" fill="#193f3e">T-s cualitativo: no usar el dibujo para calcular propiedades.</text></svg>