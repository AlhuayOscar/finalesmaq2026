<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
<title id="title">Ciclo frigorífico básico en modo frío</title><desc id="desc">Compresor a condensador: vapor de alta. Condensador a expansión: líquido de alta. Expansión a evaporador: mezcla de baja. Evaporador a compresor: vapor de baja. El aire pasa por las baterías sin mezclarse con el refrigerante.</desc>
<defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9e8b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9fe5ff"/></marker></defs>
<g fill="none" stroke-width="5"><path d="M240 95H550" stroke="#ff9e8b" marker-end="url(#red)"/><path d="M650 130V265" stroke="#ff9e8b" marker-end="url(#red)"/><path d="M550 300H240" stroke="#9fe5ff" marker-end="url(#blue)"/><path d="M150 265V130" stroke="#9fe5ff" marker-end="url(#blue)"/></g>
<g fill="#284c63" stroke="#93b8cd" stroke-width="2"><rect x="60" y="60" width="180" height="70" rx="16"/><rect x="550" y="60" width="190" height="70" rx="16"/><rect x="550" y="265" width="190" height="70" rx="16"/><rect x="60" y="265" width="180" height="70" rx="16"/></g>
<g fill="#fff" font-family="Arial,sans-serif" font-size="21" text-anchor="middle"><text x="150" y="102">1 · Compresor</text><text x="645" y="102">2 · Condensador</text><text x="645" y="307">3 · Expansión</text><text x="150" y="307">4 · Evaporador</text></g>
<g font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><g fill="#ffb7a9"><text x="394" y="78">Descarga · vapor de alta</text><text x="730" y="183">Líquido</text><text x="730" y="206">de alta</text></g><g fill="#b6eaff"><text x="392" y="327">Mezcla de líquido y vapor · baja</text><text x="72" y="183">Aspiración</text><text x="72" y="206">vapor de baja</text></g><g fill="#d4e4ee"><text x="150" y="35">Trabajo del motor ↓</text><text x="645" y="35">↑ Calor hacia el aire exterior</text><text x="150" y="371">↑ Calor del aire del recinto</text></g><text x="400" y="195" fill="#fff" font-size="22">Circuito cerrado</text><text x="400" y="225" fill="#b6cfde" font-size="16">El aire circula por fuera de los tubos.</text></g>
</svg>
