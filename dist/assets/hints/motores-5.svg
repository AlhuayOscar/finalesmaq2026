<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300"><rect width="800" height="300" rx="12" fill="#f7f6ef"/><text x="35" y="42" font-family="Arial" font-size="21" fill="#244c46">Combustión e inyección</text><text x="35" y="75" font-family="Arial" font-size="13" fill="#62776b">Pista: organizá la respuesta según las relaciones que correspondan a la pregunta.</text><rect x="40" y="120" width="230" height="90" rx="8" fill="#e5edde" stroke="#8aa18a"/><text x="155" y="169" font-family="Arial" font-size="13" text-anchor="middle" fill="#244c46">Ubicación y función</text><rect x="285" y="120" width="230" height="90" rx="8" fill="#e5edde" stroke="#8aa18a"/><text x="400" y="169" font-family="Arial" font-size="13" text-anchor="middle" fill="#244c46">Esfuerzos o circulación</text><rect x="530" y="120" width="230" height="90" rx="8" fill="#e5edde" stroke="#8aa18a"/><text x="645" y="169" font-family="Arial" font-size="13" text-anchor="middle" fill="#244c46">Síntomas y comprobaciones</text><text x="35" y="263" font-family="Arial" font-size="12" fill="#62776b">Guía conceptual de apoyo · No es una respuesta completa.</text></svg>